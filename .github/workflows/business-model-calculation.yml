  push:
    paths:
      - "config/business-model-inputs.json"
      - "pipeline/business_model.py"
      - ".github/workflows/business-model-calculation.yml"

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show current inputs (from config)
        run: |
          echo "=== Parameters in config/business-model-inputs.json ==="
          python -c "
          import json, sys
          d = json.load(open("config/business-model-inputs.json", encoding="utf-8"))
          for k,v in d.get("inputs",{}).items():
              if isinstance(v, dict):
                  for sub, subv in v.items():
                      if subv is not None:
                          print(f"{k}.{sub}: {subv}")
              else:
                  if v is not None:
                      print(f"{k}: {v}")
          print("--- Full keys (null = unknown / not set): ---")
          for k,v in d.get("inputs",{}).items():
              if isinstance(v, dict):
                  for sub in v:
                      print(f"{k}.{sub}")
              else:
                  print(k)
          "

      - name: Build overrides from inputs
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python -c "
          import os, json, sys
          raw = json.loads(os.environ["INPUTS_JSON"])
          result = {"inputs": {}}
          monthly_fixed = {}
          capex = {}
          for k, v in raw.items():
              if v == "" or v is None or str(v).strip() == "":
                  continue
              s = str(v).strip()
              parsed = s
              if s == "null" or s == "None":
                  parsed = None
              else:
                  try:
                      if "." in s or "e" in s.lower():
                          parsed = float(s)
                          if parsed.is_integer():
                              parsed = int(parsed)
                      else:
                          parsed = int(s)
                  except ValueError:
                      pass
              if k.startswith("monthly_fixed_costs_"):
                  sub = k[len("monthly_fixed_costs_"):]; monthly_fixed[sub] = parsed
              elif k.startswith("capex_breakdown_"):
                  sub = k[len("capex_breakdown_"):]; capex[sub] = parsed
              else:
                  result["inputs"][k] = parsed
          if monthly_fixed:
              result["inputs"]["monthly_fixed_costs"] = monthly_fixed
          if capex:
              result["inputs"]["capex_breakdown"] = capex
          with open("overrides.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(result, ensure_ascii=False))
          print("Overrides JSON:", json.dumps(result, ensure_ascii=False))
          "

      - name: Calculate report
        env:
          INPUT_FILE: config/business-model-inputs.json
        run: |
          echo "Running business-model calculation"
          python -c "
          import subprocess, sys
          overrides = ''
          try:
              with open('overrides.json', encoding='utf-8') as f:
                  overrides = f.read().strip()
          except FileNotFoundError:
              pass
          cmd = [
              'python', 'pipeline/business_model.py',
              '--input', 'config/business-model-inputs.json',
              '--output', 'output/business-model-calculation.md'
          ]
          if overrides:
              cmd.extend(['--overrides-json', overrides])
              print('Using overrides:', overrides[:200] + ('...' if len(overrides) > 200 else ''))
          else:
              print('No overrides provided; using config/business-model-inputs.json')
          subprocess.run(cmd, check=True)
          "

      - name: Upload calculated report
        uses: actions/upload-artifact@v4
        with:
          name: business-model-calculation
          path: output/business-model-calculation.md
          if-no-files-found: error
