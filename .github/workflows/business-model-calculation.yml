# Как запускать вручную:
# Actions → Calculate water-vending business model → Run workflow
# Оставьте поля пустыми, чтобы использовать config/business-model-inputs.json
# или заполните нужные значения — пустое = не изменять
name: Calculate water-vending business model

on:
  workflow_dispatch:
    inputs:
      price_per_5l_rsd:
        description: "Цена за 5 л, RSD (решение владельца / изменение решения)"
        required: false
        type: string
        default: ""
      volume_lpd:
        description: "Потенциальные продажи, л/день работы (измерение или явное допущение)"
        required: false
        type: string
        default: ""
      uptime_rate:
        description: "Доля времени работы 0..1 (SLA поставщика и журнал)"
        required: false
        type: string
        default: ""
      operating_days_month:
        description: "Рабочие дни в месяце (30-дневная арифметика)"
        required: false
        type: string
        default: ""
      cashless_revenue_share:
        description: "Доля безналичной выручки (фискальный отчет)"
        required: false
        type: string
        default: ""
      cashless_order_share:
        description: "Доля безналичных транзакций (фискальный/платежный отчет)"
        required: false
        type: string
        default: ""
      cashless_fee_rate:
        description: "Комиссия безналичной выручки, доля (договор эквайринга)"
        required: false
        type: string
        default: ""
      effective_sales_tax_rate:
        description: "Эффективная ставка налога на выручку (только по письму бухгалтера)"
        required: false
        type: string
        default: ""
      water_tariff_rsd_m3:
        description: "Тариф воды, RSD/м³ (счет / расчет BVK)"
        required: false
        type: string
        default: ""
      sewer_tariff_rsd_m3:
        description: "Тариф канализации, RSD/м³ (счет / расчет BVK)"
        required: false
        type: string
        default: ""
      sewer_billing_basis:
        description: "База начисления канализации: intake / reject / product (подтверждение BVK)"
        required: false
        type: string
        default: ""
      ro_intake_l_per_product_l:
        description: "Входная вода на литр готового продукта (спецификация + измерение)"
        required: false
        type: string
        default: ""
      other_variable_cost_rsd_l:
        description: "Другие переменные расходы, RSD/л"
        required: false
        type: string
        default: ""
      average_order_l:
        description: "Средний объем заказа, л (фискальные/машинные данные)"
        required: false
        type: string
        default: ""
      cash_handling_cost_rsd_per_cash_order:
        description: "Стоимость наличного заказа, RSD/заказ (инкассация / процесс)"
        required: false
        type: string
        default: ""
      refund_and_failed_sale_cost_rsd_per_order:
        description: "Средняя стоимость возврата/сбоя, RSD/заказ (журналы инцидентов)"
        required: false
        type: string
        default: ""
      site_area_sqm:
        description: "Площадь точки, м² (полевое измерение, необязательное)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_rent:
        description: "Аренда, RSD/месяц (договор)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_electricity:
        description: "Электроэнергия, RSD/месяц (счета)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_telemetry_and_connectivity:
        description: "Телеметрия и связь, RSD/месяц (договор / счет)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_service_and_filters:
        description: "Сервис и фильтры, RSD/месяц (договор)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_labor_and_cash_collection:
        description: "Труд и инкассация, RSD/месяц (учет)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_laboratory_and_quality:
        description: "Лаборатория и качество, RSD/месяц (договор)"
        required: false
        type: string
        default: ""
      monthly_fixed_costs_insurance:
        description: "Страхование, RSD/месяц (договор)"
        required: false
        type: string
        default: ""
      parameters_json:
        description: "JSON-override для оставшихся параметров (capex_breakdown.*, другие fixed, scenario). Пример: {\"capex_breakdown\":{\"equipment\":500000}}"
        required: false
        type: string
        default: ""
  push:
    paths:
      - "config/business-model-inputs.json"
      - "pipeline/business_model.py"
      - ".github/workflows/business-model-calculation.yml"

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show current inputs (from config)
        run: |
          echo "=== Parameters in config/business-model-inputs.json ==="
          python -c "
          import json, sys
          d = json.load(open("config/business-model-inputs.json", encoding="utf-8"))
          for k,v in d.get("inputs",{}).items():
              if isinstance(v, dict):
                  for sub, subv in v.items():
                      if subv is not None:
                          print(f"{k}.{sub}: {subv}")
              else:
                  if v is not None:
                      print(f"{k}: {v}")
          print("--- Full keys (null = unknown / not set): ---")
          for k,v in d.get("inputs",{}).items():
              if isinstance(v, dict):
                  for sub in v:
                      print(f"{k}.{sub}")
              else:
                  print(k)
          "

      - name: Build overrides from inputs
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python -c "
          import os, json, sys
          raw = json.loads(os.environ["INPUTS_JSON"])
          result = {"inputs": {}}
          monthly_fixed = {}
          capex = {}
          for k, v in raw.items():
              if v == "" or v is None or str(v).strip() == "":
                  continue
              s = str(v).strip()
              parsed = s
              if s == "null" or s == "None":
                  parsed = None
              else:
                  try:
                      if "." in s or "e" in s.lower():
                          parsed = float(s)
                          if parsed.is_integer():
                              parsed = int(parsed)
                      else:
                          parsed = int(s)
                  except ValueError:
                      pass
              if k.startswith("monthly_fixed_costs_"):
                  sub = k[len("monthly_fixed_costs_"):]; monthly_fixed[sub] = parsed
              elif k.startswith("capex_breakdown_"):
                  sub = k[len("capex_breakdown_"):]; capex[sub] = parsed
              else:
                  result["inputs"][k] = parsed
          if monthly_fixed:
              result["inputs"]["monthly_fixed_costs"] = monthly_fixed
          if capex:
              result["inputs"]["capex_breakdown"] = capex
          with open("overrides.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(result, ensure_ascii=False))
          print("Overrides JSON:", json.dumps(result, ensure_ascii=False))
          "

      - name: Calculate report
        env:
          INPUT_FILE: config/business-model-inputs.json
        run: |
          echo "Running: python pipeline/business_model.py --input $INPUT_FILE --output output/business-model-calculation.md --overrides-json "$(cat overrides.json)""
          python pipeline/business_model.py --input "$INPUT_FILE" --output output/business-model-calculation.md --overrides-json "$(cat overrides.json)"

      - name: Upload calculated report
        uses: actions/upload-artifact@v4
        with:
          name: business-model-calculation
          path: output/business-model-calculation.md
          if-no-files-found: error
