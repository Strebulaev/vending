name: Calculate pilot unit economics
run-name: Unit economics • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      price_per_5l_rsd:
        description: "Цена за 5 л, RSD (решение владельца / изменение решения)"
        required: false
        type: string
      volume_lpd:
        description: "Продажи, л/день работы (измерение или помеченное допущение)"
        required: false
        type: string
      uptime_rate:
        description: "Доля доступности 0..1 (SLA/журнал простоев)"
        required: false
        type: string
      operating_days_month:
        description: "Рабочих дней за месяц"
        required: false
        type: string
      cashless_revenue_share:
        description: "Доля безналичной выручки, 0..1"
        required: false
        type: string
      cashless_order_share:
        description: "Доля безналичных заказов, 0..1"
        required: false
        type: string
      cashless_fee_rate:
        description: "Комиссия эквайринга, доля 0..1"
        required: false
        type: string
      effective_sales_tax_rate:
        description: "Эффективный расход с выручки, 0..1 (только по модели бухгалтера)"
        required: false
        type: string
      water_tariff_rsd_m3:
        description: "Тариф воды, RSD/м³"
        required: false
        type: string
      sewer_tariff_rsd_m3:
        description: "Тариф водоотведения, RSD/м³"
        required: false
        type: string
      sewer_billing_basis:
        description: "Основа тарифа BVK: intake, reject или product"
        required: false
        type: string
      ro_intake_l_per_product_l:
        description: "Литры входной воды на литр продукта"
        required: false
        type: string
      other_variable_cost_rsd_l:
        description: "Прочие переменные расходы, RSD/л"
        required: false
        type: string
      average_order_l:
        description: "Средний заказ, литров"
        required: false
        type: string
      cash_handling_cost_rsd_per_cash_order:
        description: "Обработка/инкассация наличного заказа, RSD/заказ"
        required: false
        type: string
      refund_and_failed_sale_cost_rsd_per_order:
        description: "Средняя стоимость возврата/сбоя, RSD/заказ"
        required: false
        type: string
      site_area_sqm:
        description: "Площадь точки, м² (необязательно)"
        required: false
        type: string
      monthly_fixed_costs_rent:
        description: "Аренда, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_electricity:
        description: "Электричество, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_telemetry_and_connectivity:
        description: "Телеметрия и связь, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_service_and_filters:
        description: "Сервис и фильтры, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_labor_and_cash_collection:
        description: "Труд/инкассация, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_laboratory_and_quality:
        description: "Лаборатория и качество, RSD/месяц"
        required: false
        type: string
      monthly_fixed_costs_insurance:
        description: "Страхование, RSD/месяц"
        required: false
        type: string
      parameters_json:
        description: "JSON для CAPEX, депозита/размена, остальных затрат, сценариев, источников, прогноза и чувствительности. Пусто = использовать конфиг."
        required: false
        type: string
  push:
    paths:
      - "config/business-model-inputs.json"
      - "pipeline/business_model.py"
      - "pipeline/build_business_model_overrides.py"
      - ".github/workflows/pilot-unit-economics.yml"

permissions:
  contents: read

concurrency:
  group: unit-economics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculate:
    name: Calculate, render and publish report artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate parameter overrides
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_INPUTS_JSON: ${{ toJson(github.event.inputs) }}
        run: |
          python pipeline/build_business_model_overrides.py output/overrides.json

      - name: Calculate unit economics and render report
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p output
          args=(
            --input config/business-model-inputs.json
            --output output/business-model-calculation.md
            --diagram-output output/business-model-flow.mmd
            --json-output output/business-model-calculation.json
          )
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--overrides-file output/overrides.json)
          fi
          python pipeline/business_model.py "${args[@]}"

      - name: Add decision summary to this workflow run
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          report = Path("output/business-model-calculation.md").read_text(encoding="utf-8")
          header, _, rest = report.partition("## Сводка сценариев")
          scenarios, _, rest = rest.partition("## Как считается модель")
          diagram, _, _ = rest.partition("## Реестр параметров и источников")
          print(header.rstrip())
          print("## Сводка сценариев" + scenarios.rstrip())
          print("\n## Диаграмма расчёта\n" + diagram.rstrip())
          print("\nПолный финансовый расчёт, источники, неизвестные, сценарии и JSON приложены в артефакте `pilot-unit-economics-*`.")
          PY

      - name: Upload unit-economics package
        uses: actions/upload-artifact@v4
        with:
          name: pilot-unit-economics-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 30
